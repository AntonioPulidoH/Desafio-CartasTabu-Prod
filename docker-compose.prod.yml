# DOCKER COMPOSE — PRODUCCIÓN

services:


  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.prod
    restart: always
    env_file:
      - backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "yarn exec prisma migrate deploy &&
             yarn start:prod"

 
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.prod
    restart: always
    env_file:
      - frontend/.env
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
      - frontend_dist:/var/www/app/dist:ro
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  frontend_dist: