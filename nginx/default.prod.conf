# NGINX — Configuración de PRODUCCIÓN

limit_req_zone $binary_remote_addr zone=auth_limit:1m rate=10r/m;

upstream backend {
    server backend:3000;
}

# Servidor HTTP — redirige TODO el tráfico a HTTPS

server {
    listen 80;
    server_name _;

    # Excepción: ruta de verificación ACME de Certbot (necesaria para renovar SSL)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Todo lo demás → HTTPS (301 permanente)
    location / {
        return 301 https://$host$request_uri;
    }
}


# Servidor HTTPS

server {
    listen 443 ssl;
    server_name _;

    # --- Certificados SSL
    ssl_certificate     /etc/letsencrypt/live/${DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DOMAIN}/privkey.pem;

    # Protocolos y cifrados seguros (deshabilita TLS 1.0 y 1.1 obsoletos)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

  
    # CABECERAS DE SEGURIDAD HTTP
  

    # Fuerza HTTPS durante 1 año e incluye subdominios.
    # Evita que el navegador acceda por HTTP aunque el usuario lo escriba.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Impide que el navegador "adivine" el tipo MIME de un archivo.
    # Evita ataques de tipo MIME sniffing.
    add_header X-Content-Type-Options "nosniff" always;

    # Controla qué información de referencia se envía al navegar.
    # "no-referrer-when-downgrade" no envía la URL si se baja de HTTPS a HTTP.
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Restringe qué recursos puede cargar la página (scripts, imágenes, etc.).
    # Reduce el riesgo de ataques XSS e inyección de contenido externo.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self';" always;

    # Controla el acceso a funciones del navegador (cámara, micrófono, etc.).
    # Deshabilita las que la app no necesita.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Impide que la página se cargue dentro de un <iframe> de otro dominio.
    # Protege contra ataques de clickjacking.
    add_header X-Frame-Options "SAMEORIGIN" always;


    # BLOQUEO DE ARCHIVOS SENSIBLES
   

    # Bloquea el acceso a .env, .git, .htaccess y similares.
    # Devuelve 404 (en vez de 403) para no revelar que existen.
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|git|htaccess|htpasswd|ini|log|sh|sql|conf)$ {
        deny all;
        return 404;
    }


    # FRONTEND — archivos estáticos generados por Vite build

    root /var/www/app/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache agresiva para assets con hash en el nombre (js, css, imágenes)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }


    # BACKEND API

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rate limiting en login y registro
    # burst=5 → permite una ráfaga de hasta 5 peticiones antes de empezar a denegar.
    # nodelay → las peticiones del burst no se encolan, se procesan de inmediato.
    location ~ ^/api/(auth/login|auth/register) {
        limit_req zone=auth_limit burst=5 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}