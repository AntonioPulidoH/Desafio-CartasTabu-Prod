# Zonas para Rate Limiting
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=register_limit:10m rate=3r/m;

upstream frontend {
    # Apunta al puerto 80 del contenedor frontend (Nginx interno)
    server frontend:80;
}

upstream backend {
    server backend:3000;
}

server {
    listen 80;

    # Reglas de seguridad (Bloquear accesos no deseados)
    location ~ /\.(.*)$ { deny all; }
    location ~* \.(env|ini|log|sql|bak|old|backup)$ { deny all; }
    location ^~ /.git { deny all; }
    location ~* /(docker-compose\.yml|Dockerfile|Makefile|composer\.json|package\.json)$ { deny all; }

        location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend
    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proteger Login
    location = /api/auth/login {
        limit_req zone=login_limit burst=2 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proteger Registro
    location = /api/users/register {
        limit_req zone=register_limit burst=1 nodelay;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resto de la API
    location /api {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}